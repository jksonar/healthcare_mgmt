<h2>Manage Availability</h2>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Add Slot</button>
</form>

<h3>Your Available Slots</h3>
<ul>
    {% for slot in availabilities %}
        <li>{{ slot.day_of_week }}: {{ slot.start_time }} - {{ slot.end_time }}</li>
    {% empty %}
        <li>No slots set.</li>
    {% endfor %}
</ul>
