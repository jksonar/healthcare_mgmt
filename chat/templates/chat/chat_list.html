<h2>Your Conversations</h2>
<ul>
    {% for user in users %}
        <li>
            <a href="{% url 'chat_detail' user.id %}">{{ user.get_full_name }} ({{ user.username }})</a>
        </li>
    {% empty %}
        <li>No conversations yet. <a href="{% url 'start_chat' %}">Start a chat</a></li>
    {% endfor %}
</ul>
